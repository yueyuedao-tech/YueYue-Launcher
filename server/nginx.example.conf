# 已有 nginx（并已有 mindustry.wiki 的证书）时，加一个 server 块即可。
#
#   · 证书路径换成你自己那份（Let's Encrypt 一般在 /etc/letsencrypt/live/mindustry.wiki/）
#   · 后端地址换成容器实际监听的地方：
#       - compose 默认把容器 1020 映射到宿主机 1020 → 用 127.0.0.1:1020
#       - 若用 docker-compose.tls.yml（容器不再对外暴露端口）→ 用容器名 yyl-central:1020
#
# 改完：nginx -t && nginx -s reload

server {
    listen 1020 ssl;
    listen [::]:1020 ssl;
    http2 on;
    server_name mindustry.wiki;

    ssl_certificate     /etc/letsencrypt/live/mindustry.wiki/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindustry.wiki/privkey.pem;

    # 中心化索引：绝对不要缓存，否则客户端会一直拿到旧的版本列表
    location = /index.json {
        proxy_pass http://127.0.0.1:1020;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # 信息服务器（每日信息 Markdown）与健康检查，一起转给同一个上游
    location / {
        proxy_pass http://127.0.0.1:1020;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
}

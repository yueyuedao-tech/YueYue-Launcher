name: release-linux

# 只手动触发：本机是 Windows，Linux 产物交给 GitHub 的 Linux runner 构建，
# 避免在只有 1GB 空闲内存的生产服务器上跑 Rust 编译。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '把产物附加到哪个 release tag'
        required: true
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  linux:
    name: Linux x64 (.deb / .AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: 取出源码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # Tauri v2 在 Linux 上需要的系统依赖
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      # 必须先构建前端：tauri::generate_context!() 会校验 frontendDist（../dist）是否存在，
      # 目录不在时这个 proc macro 直接 panic，连 cargo test 都会挂（CI 上踩过两次）
      - name: 构建前端
        run: npm run build

      - name: 跑测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 构建并上传到 release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: 'YueYue Launcher (YYL) v0.1.1'
          releaseDraft: false
          prerelease: false
          args: --bundles deb,appimage

      - name: 产物清单
        run: |
          echo "=== 生成的包 ==="
          find src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) -printf '%p  %s bytes\n'
